name: Build jailbreak packages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make perl git curl xz-utils

      - name: Install roothide Theos
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Verify Theos tools
        run: |
          printf 'THEOS=%s\n' "$THEOS"
          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          make --version
          clang --version

      - name: Build rootless package
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless
          mkdir -p dist
          cp packages/*.deb dist/FloatBack-rootless.deb

      - name: Build roothide package
        run: |
          make clean package THEOS_PACKAGE_SCHEME=roothide
          cp packages/*.deb dist/FloatBack-roothide.deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: FloatBack-debs
          path: dist/*.deb
